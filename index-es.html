<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="11;url=https://www.freewalkingtourcartagena.com/index-es.html">
    <link rel="canonical" href="https://www.freewalkingtourcartagena.com/index-es.html">
    <title>¡Nos hemos mudado! - Free Walking Tour Cartagena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ffcc00;
            --dark-color: #14213d;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Lato', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            color: white;
            background-color: #000;
        }

        /* Language Switcher Bar */
        .lang-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            gap: 10px;
            background: rgba(20, 33, 61, 0.7);
            padding: 8px 16px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .lang-btn {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.3s;
        }
        .lang-btn.active {
            color: var(--primary-color);
        }
        .lang-btn:hover {
            color: white;
        }
        .lang-flag {
            width: 18px;
            height: 12px;
            border-radius: 2px;
            object-fit: cover;
        }

        /* Collage Background */
        .collage-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 8px;
            padding: 8px;
            z-index: -2;
        }
        .collage-bg div {
            background-size: cover;
            background-position: center;
            filter: brightness(0.5);
            border-radius: 4px;
        }
        .img1 { background-image: url('images/old-city-6.jpg'); }
        .img2 { background-image: url('images/getsemani.jpg'); background-position: center 90% !important; }
        .img3 { background-image: url('images/guias.jpg'); }
        .img4 { background-image: url('images/palenque.jpeg'); }
        .img5 { background-image: url('images/santa-teresa.jpg'); }
        .img6 { background-image: url('images/bazurto.jpg'); }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(20,33,61,0.3) 0%, rgba(20,33,61,0.7) 100%);
            z-index: -1;
        }

        .content {
            max-width: 650px;
            width: 90%;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .badge {
            display: inline-block;
            background: rgba(255, 204, 0, 0.2);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 3.8rem;
            font-weight: 900;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        p {
            font-size: 1.35rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            font-weight: 400;
        }

        p strong {
            color: var(--primary-color);
            font-weight: 700;
        }

        .btn-back {
            display: inline-block;
            padding: 1.2rem 3.5rem;
            background-color: var(--primary-color);
            color: var(--dark-color);
            text-decoration: none;
            font-weight: 900;
            font-size: 1.25rem;
            border-radius: 50px;
            transition: all 0.3s;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-shadow: none;
        }

        .btn-back:hover {
            transform: translateY(-5px);
            background-color: white;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
        }

        .redirect-notice {
            margin-top: 30px;
            font-size: 0.95rem;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.7rem; }
            p { font-size: 1.1rem; }
            .collage-bg { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); }
            .btn-back { padding: 1.1rem 2.5rem; font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <!-- Idioma Selector -->
    <div class="lang-switcher">
        <a href="index-es.html" class="lang-btn active">
            <img src="images/es-flag.png" alt="ES" class="lang-flag"> ES
        </a>
        <span style="opacity:0.4;">|</span>
        <a href="index.html" class="lang-btn">
            <img src="images/us-flag.png" alt="EN" class="lang-flag"> EN
        </a>
    </div>

    <!-- Fondo de imágenes -->
    <div class="collage-bg">
        <div class="img1"></div>
        <div class="img2"></div>
        <div class="img3"></div>
        <div class="img4"></div>
        <div class="img5"></div>
        <div class="img6"></div>
    </div>
    <div class="overlay"></div>

    <div class="content">
        <div class="badge">🌐 Mudanza de Sitio Web</div>
        <h1>¡NOS HEMOS MUDADO!</h1>
        <p>Nuestro sitio web oficial ahora es <strong>www.freewalkingtourcartagena.com</strong>.<br>Haz clic en el botón de abajo para ir a nuestra nueva página.</p>
        
        <div class="button-group">
            <a href="https://www.freewalkingtourcartagena.com/index-es.html" class="btn-back">IR A LA NUEVA PÁGINA &rarr;</a>
        </div>

        <div class="redirect-notice">
            Serás redirigido automáticamente en <span id="countdown">10</span> segundos...
        </div>
    </div>

    <script>
        let seconds = 10;
        const countdownEl = document.getElementById('countdown');
        const timer = setInterval(() => {
            seconds--;
            if (countdownEl) countdownEl.innerText = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = "https://www.freewalkingtourcartagena.com/index-es.html";
            }
        }, 1000);
    </script>
</body>
</html>
